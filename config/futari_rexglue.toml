# XenonRecomp configuration for Mushihimesama Futari Ver. 1.5
#
# TODO: Run scripts/analyse_xex.py on assets/default.xex and fill in all
#       addresses marked TODO below. Use XenonAnalyse to generate switch tables.
#
# Reference: https://github.com/hedge-dev/XenonRecomp

[main]
file_path = "../assets/default.xex"
out_directory_path = "../generated"

switch_table_file_path = "futari_switch_tables.toml"

# Optimisations — disable everything on first pass for easier debugging
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

